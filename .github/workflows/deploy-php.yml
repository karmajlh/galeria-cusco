name: Deploy PHP to Galeria Cusco

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy PHP application
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          source: "php-app/*.php,php-app/.htaccess"
          target: "/home/mixshopc/public_html/galeriacusco.info.gf/"
          strip_components: 1

